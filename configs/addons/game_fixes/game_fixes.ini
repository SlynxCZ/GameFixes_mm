// GameFixes -- one block per fix. A fix only does anything with "enable" "1";
// a missing block counts as disabled. Everything else in a block is that
// fix's own options.
"game_fixes"
{
	// The game allocates any registered classname but only constructs a
	// class its schema allows; anything else (weapon_cs_base in old map
	// ports and their game_player_equip) crashes the server on a null
	// vtable. Creating such an entity fails like an unknown classname.
	"abstract_entity"
	{
		"enable"	"1"
	}

	// CBeam::SetBeamOrigin / SetBeamEndPos loop forever on a beam that has
	// no parent -- an easy way for a map to crash the server. Reimplements
	// the unparented path.
	"beam_crash"
	{
		"enable"	"1"
	}

	// With tv_enable 1: keeps the GOTV client from being disconnected and
	// reserves its slot on top of the session's maxplayers, so the demo
	// keeps recording across match restarts on the same map.
	"demo_record"
	{
		"enable"	"1"
	}

	// Patches SetSchemaHammerUniqueId so m_sUniqueHammerID is filled in on
	// every entity.
	"hammer_id"
	{
		"enable"	"1"
	}

	// curtime is a 32-bit float and loses precision after a day or two of
	// uptime on one map (animations and movement turn sluggish). Every
	// reload_interval seconds, while no human is connected, the current map
	// is reloaded to reset it; the remaining mp_timelimit is carried over.
	"slow_animation"
	{
		"enable"			"1"
		"reload_interval"	"1800"	// seconds between empty-server checks
	}

	// The engine's per-frame GC ban / competitive cooldown kick pass
	// (GameSystem_Think_CheckSteamBan). Accounts in whitelist are stripped
	// out before the pass runs, so are competitive cooldowns while
	// sv_kick_players_with_cooldown is below 2, and with clear_after_pass
	// whatever the pass leaves behind is cleared so a stale entry can't hit
	// the next player to join.
	"steam_ban"
	{
		"enable"	"1"
		"clear_after_pass"	"1"
		// Other plugins can allow accounts at runtime (IGameFixes, e.g.
		// FUNPLAY's active admins). An account nobody allowed yet is held
		// this long before the engine may kick it; 0 = no hold.
		"hold_seconds"	"15"
		"whitelist"	// any label -> SteamID64
		{
			//"Slynx"	"76561198000000000"
		}
	}

	// The game refuses a join as "team full" at the smaller of the team's max
	// count and its enabled spawn points. Both are raised to maxplayers every
	// frame (maps toggle spawn points mid-round), so players beyond the map's
	// spawns share them. Autobalance is untouched; it only runs on a round
	// restart, so servers with one long round never balance.
	"team_limit"
	{
		"enable"	"1"
	}

	// CBaseFilter::InputTestActivator dereferences the input's activator
	// without checking it; a TestActivator input fired with none crashes the
	// server. Drops those calls.
	"input_activator_crash"
	{
		"enable"	"1"
	}

	// Turning sv_cheats off leaves anyone in noclip flying. Puts every such
	// pawn back to MOVETYPE_WALK the moment the cvar flips to 0.
	"sv_cheats"
	{
		"enable"	"1"
	}

	// Pushes every connected player's SteamID, name and score to the Steam
	// game server API every update_interval seconds, so the server browser
	// actually lists the players (Source2ZE/ServerListPlayersFix).
	"server_list_players"
	{
		"enable"			"1"
		"update_interval"	"5"	// seconds
	}

	// Surf ramps: a trace that stops a hair short of a ramp, or on its edge,
	// hands TryPlayerMove a plane it never really hit, and the player is
	// flung off (a rampbug). The traces are redone from a small offset along
	// the last valid plane, and a bad result is put back where it belongs.
	// CS2KZ's fix, as carried by CS2Fixes-RampbugFix; it lessens rampbugs,
	// it does not end them. What a player was on is forgotten on a teleport.
	"rampbug"
	{
		"enable"	"1"
		// Put the fix's own walk back over the game's TryPlayerMove when the
		// game moved the player elsewhere. The game has its own mitigation
		// now and this overrides far more often than needed: off by default.
		"tryplayermove_override"	"0"
	}

	// Touching the bottom of a body of water, the CategorizePosition after
	// WaterMove counts the player as standing on it and a jump out of the
	// water no longer takes. That one CategorizePosition is skipped.
	"water_jump"
	{
		"enable"	"1"
	}

	// Drops malformed or oversized clc_VoiceData before the engine handles
	// it (16 KiB / 64 packets per message) and holds every client to 192
	// messages, 256 KiB and 1024 packets per second. Never kicks anyone.
	"voice_flood"
	{
		"enable"	"1"
	}
}
