// GameFixes -- one block per fix. A fix only does anything with "enable" "1";
// a missing block counts as disabled. Everything else in a block is that
// fix's own options.
"game_fixes"
{
	// CBeam::SetBeamOrigin / SetBeamEndPos loop forever on a beam that has
	// no parent -- an easy way for a map to crash the server. Reimplements
	// the unparented path.
	"beam_crash"
	{
		"enable"	"1"
	}

	// With tv_enable 1: keeps the GOTV client from being disconnected and
	// reserves its slot on top of the session's maxplayers, so the demo
	// keeps recording across match restarts on the same map.
	"demo_record"
	{
		"enable"	"1"
	}

	// Patches SetSchemaHammerUniqueId so m_sUniqueHammerID is filled in on
	// every entity.
	"hammer_id"
	{
		"enable"	"1"
	}

	// curtime is a 32-bit float and loses precision after a day or two of
	// uptime on one map (animations and movement turn sluggish). Every
	// reload_interval seconds, while no human is connected, the current map
	// is reloaded to reset it; the remaining mp_timelimit is carried over.
	"slow_animation"
	{
		"enable"			"1"
		"reload_interval"	"1800"	// seconds between empty-server checks
	}

	// Clients key voice playback off the xuid in svc_VoiceData; on workshop
	// maps it doesn't identify the speaker uniquely, streams collide and
	// players stop hearing each other. Gives every speaker a distinct xuid
	// per listener, rewritten in CServerSideClient::SendNetMessage.
	"workshop_voice"
	{
		"enable"	"1"
	}

	// The engine's per-frame GC ban / competitive cooldown kick pass
	// (GameSystem_Think_CheckSteamBan). Accounts in whitelist are stripped
	// out before the pass runs, so are competitive cooldowns while
	// sv_kick_players_with_cooldown is below 2, and with clear_after_pass
	// whatever the pass leaves behind is cleared so a stale entry can't hit
	// the next player to join.
	"steam_ban"
	{
		"enable"	"1"
		"clear_after_pass"	"1"
		"whitelist"	// any label -> SteamID64
		{
			//"Slynx"	"76561198000000000"
		}
	}

	// On every round_start, CCSGameRules' spawnable/max T and CT counts are
	// raised to maxplayers, so the game never refuses a join because a team
	// is "full".
	"team_limit"
	{
		"enable"	"1"
	}

	// CBaseFilter::InputTestActivator dereferences the input's activator
	// without checking it; a TestActivator input fired with none crashes the
	// server. Drops those calls.
	"input_activator_crash"
	{
		"enable"	"1"
	}

	// Turning sv_cheats off leaves anyone in noclip flying. Puts every such
	// pawn back to MOVETYPE_WALK the moment the cvar flips to 0.
	"sv_cheats"
	{
		"enable"	"1"
	}

	// Pushes every connected player's SteamID, name and score to the Steam
	// game server API every update_interval seconds, so the server browser
	// actually lists the players (Source2ZE/ServerListPlayersFix).
	"server_list_players"
	{
		"enable"			"1"
		"update_interval"	"5"	// seconds
	}
}
